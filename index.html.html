<!--
═══════════════════════════════════════════════════════════════════════
  TASTE-VISION SONG CONTEST — SETUP GUIDE
═══════════════════════════════════════════════════════════════════════

  This application requires a FREE Firebase account to enable
  real-time voting across multiple devices. Follow the steps below
  to connect your own database. Takes about 5 minutes.

  ── STEP 1: Create a Firebase project ─────────────────────────────
  1. Go to https://console.firebase.google.com
  2. Click "Add project"
  3. Give it a name (e.g. "my-song-contest")
  4. Click Continue → enable or disable Google Analytics as you prefer
  5. Click "Create project" and wait for it to finish

  ── STEP 2: Create a Realtime Database ────────────────────────────
  1. In the left sidebar click "Build" → "Realtime Database"
  2. Click "Create database"
  3. Choose your region (pick closest to your event location)
  4. Select "Start in test mode" → click "Enable"
  5. Your database is now live

  ── STEP 3: Get your Firebase config values ───────────────────────
  1. Click the ⚙ gear icon (top left) → "Project settings"
  2. Scroll down to "Your apps"
  3. Click the </> (Web) icon
  4. Enter any nickname (e.g. "contest-app") → click "Register app"
  5. Firebase shows you a config block — copy the values from it

  ── STEP 4: Fill in your values ───────────────────────────────────
  Search for "const FIREBASE_CONFIG" in this file (around line 820).
  Replace each empty string '' with the value from your Firebase
  config. Keep the quotes. Do NOT share this file publicly once
  your values are filled in — it contains your API credentials.

  ── STEP 5: Deploy ────────────────────────────────────────────────
  1. Save this file
  2. Go to https://app.netlify.com/drop
  3. Drag and drop this file onto the page
  4. Netlify gives you a public URL — share it with your voters!
  5. Show the QR code from the Host panel for easy mobile access

  ── SECURITY NOTE ─────────────────────────────────────────────────
  Your database starts in "test mode" which allows anyone with the
  URL to read and write. This is fine for a private event. After
  your event, go to Firebase Console → Realtime Database → Rules
  and set ".write" to false to lock it down.

  ── TROUBLESHOOTING ───────────────────────────────────────────────
  • "Voting Closed" on voter phones → make sure the host has clicked
    "Open Voting" in the Host Panel
  • Votes not syncing → check that databaseURL is filled in and that
    your Firebase project has Realtime Database enabled
  • App shows spinner indefinitely → your Firebase config has an
    error; double-check all values are copied correctly
  • Flags not showing → you need an internet connection for the
    first load; after that flags are cached by the browser

═══════════════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0014">
<title>Taste-Vision Song Contest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#FFD700;--hot:#FF2D78;--cyan:#00E5FF;--purple:#7B2FBE;
  --dark:#0A0014;--card:#120020;--card2:#1a002e;
  --border:rgba(255,255,255,0.11);--text:#F0E6FF;--muted:#9A85B0;
  --green:#00FF88;--orange:#FF6B00;
  --sbot:env(safe-area-inset-bottom,0px);
  --stop:env(safe-area-inset-top,0px);
}
html{height:100%;background:var(--dark)}
body{min-height:100%;background:var(--dark);color:var(--text);
  font-family:'Outfit',sans-serif;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  padding-top:var(--stop);padding-bottom:var(--sbot)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Emoji image rendering ───────────────────────────── */
.ei{display:inline-block;vertical-align:middle;object-fit:contain;flex-shrink:0}
.ei-sm{width:1.15rem;height:1.15rem}
.ei-md{width:1.5rem;height:1.5rem}
.ei-lg{width:2rem;height:2rem}
.ei-xl{width:2.6rem;height:2.6rem}
.ei-winner{width:4rem;height:4rem}

/* ── Stars ───────────────────────────────────────────── */
#sf{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--d,3s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:.08;transform:scale(1)}100%{opacity:.7;transform:scale(1.4)}}

/* ── Screen ──────────────────────────────────────────── */
.screen{position:relative;z-index:1;min-height:100svh;
  padding:1rem;padding-bottom:calc(1.5rem + var(--sbot));
  max-width:640px;margin:0 auto}

/* ── Logo ────────────────────────────────────────────── */
.logo{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.6rem,7vw,3rem);letter-spacing:4px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--hot) 40%,var(--cyan) 70%,var(--purple) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1;display:block}
.tagline{font-size:.75rem;letter-spacing:.18em;color:var(--muted);
  text-transform:uppercase;margin-top:.3rem}

/* ── Toastmasters logo block ─────────────────────────── */
.tm-logo-wrap{display:flex;align-items:center;justify-content:center;
  gap:.9rem;margin-bottom:.6rem}
.tm-svg{flex-shrink:0;filter:drop-shadow(0 2px 16px rgba(119,36,50,.6))}
.tm-wordmark{text-align:left}
.tm-word-top{font-family:'Bebas Neue',sans-serif;font-size:clamp(.9rem,3.5vw,1.25rem);
  letter-spacing:.22em;color:#F2DF74;line-height:1;text-transform:uppercase}
.tm-word-int{font-family:'Outfit',sans-serif;font-size:clamp(.55rem,2vw,.7rem);
  letter-spacing:.15em;color:#A9B2B1;text-transform:uppercase;margin-top:.1rem}
.tm-divider{width:100%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(242,223,116,.3),transparent);
  margin:.5rem 0}

/* ── Cards ───────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:1.25rem;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.card-sm{padding:.875rem;border-radius:13px}
.card-xs{padding:.65rem .875rem;border-radius:10px}

/* ── Buttons (48px min touch) ────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:48px;font-family:'Outfit',sans-serif;font-weight:600;
  font-size:.92rem;cursor:pointer;border:none;border-radius:12px;
  padding:.7rem 1.3rem;transition:transform .12s,opacity .15s;
  -webkit-user-select:none;user-select:none}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.btn:active{transform:scale(.95);opacity:.85}
.btn:disabled{opacity:.38;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--hot),var(--purple));color:#fff}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#FF9500);color:#000;font-weight:800}
.btn-danger{background:rgba(255,60,60,.14);color:#FF7070;border:1px solid rgba(255,60,60,.28)}
.btn-sm{min-height:40px;padding:.5rem 1rem;font-size:.84rem;border-radius:10px}
.btn-xs{min-height:36px;padding:.4rem .75rem;font-size:.78rem;border-radius:8px}
.btn-full{width:100%}

/* ── Reveal two-column layout ───────────────────────── */
.reveal-screen{position:relative;z-index:1;min-height:100svh;
  padding:1rem;padding-bottom:calc(1rem + var(--sbot));
  max-width:1200px;margin:0 auto}
.reveal-header{margin-bottom:.75rem}
.reveal-body{display:grid;grid-template-columns:1fr;gap:.85rem}
@media(min-width:700px){
  .reveal-body{grid-template-columns:1fr 1fr;align-items:start}
}
/* Scoreboard col scrolls independently on desktop so it never overflows */
.reveal-right{display:flex;flex-direction:column;gap:0}
@media(min-width:700px){
  .reveal-right{max-height:calc(100vh - 140px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;padding-right:2px}
  .reveal-right::-webkit-scrollbar{width:3px}
  .reveal-right::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
}
/* Announcement card: fixed height on desktop so it doesn't shift layout */
.announce-card{display:flex;align-items:center;justify-content:center;
  border-radius:18px}
@media(min-width:700px){
  .announce-card{min-height:calc(100vh - 280px)}
}
@media(max-width:699px){
  .announce-card{min-height:220px}
}
/* Compact srow for reveal scoreboard */
.srow-compact{padding:.55rem .75rem;border-radius:10px}
/* ── Toggle switch ───────────────────────────────────── */
.toggle-wrap{display:flex;align-items:center;gap:.55rem;cursor:pointer;
  -webkit-user-select:none;user-select:none}
.toggle-track{position:relative;width:52px;height:28px;border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.08);
  transition:background .25s,border-color .25s,box-shadow .25s;
  flex-shrink:0}
.toggle-track.on{
  background:linear-gradient(135deg,var(--hot),var(--purple));
  border-color:var(--hot);
  box-shadow:0 0 12px rgba(255,45,120,.35)}
.toggle-thumb{position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
  transition:transform .22s cubic-bezier(.34,1.3,.64,1)}
.toggle-track.on .toggle-thumb{transform:translateX(24px)}
.toggle-label{font-size:.8rem;font-weight:600;color:var(--muted);
  transition:color .2s;min-width:2rem}
.toggle-track.on~.toggle-label{color:var(--text)}

/* ── Inputs ──────────────────────────────────────────── */
input[type=text]{background:rgba(255,255,255,.07);border:1px solid var(--border);
  border-radius:12px;padding:.85rem 1rem;color:var(--text);
  font-family:'Outfit',sans-serif;font-size:1rem;width:100%;
  min-height:50px;transition:border-color .2s;-webkit-appearance:none}
input[type=text]::placeholder{color:var(--muted)}
input[type=text]:focus{outline:none;border-color:var(--cyan);background:rgba(0,229,255,.05)}

/* ── Layout ──────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:.6rem}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:.7rem}
.center{text-align:center}

/* ── Section title ───────────────────────────────────── */
.stitle{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;
  letter-spacing:2px;color:var(--gold);margin-bottom:.7rem}

/* ── Tabs ────────────────────────────────────────────── */
.tabs{display:flex;gap:.35rem;background:rgba(255,255,255,.05);
  padding:.35rem;border-radius:13px;margin-bottom:1.1rem}
.tab{flex:1;padding:.55rem .25rem;border-radius:9px;border:none;cursor:pointer;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:.8rem;
  color:var(--muted);background:transparent;transition:all .18s;min-height:40px}
.tab.on{background:rgba(255,45,120,.28);color:#fff;border:1px solid rgba(255,45,120,.45)}
.tab:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

/* ── Pills ───────────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:.35rem;
  padding:.28rem .75rem;border-radius:99px;font-size:.76rem;font-weight:700}
.pill-on{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.28)}
.pill-off{background:rgba(255,107,0,.1);color:var(--orange);border:1px solid rgba(255,107,0,.28)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;
  animation:pulse 1.5s ease-in-out infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Alerts ──────────────────────────────────────────── */
.alert{padding:.75rem 1rem;border-radius:11px;font-size:.86rem;line-height:1.5}
.a-warn{background:rgba(255,180,50,.09);border:1px solid rgba(255,180,50,.28);color:#FFB432}
.a-err{background:rgba(255,60,60,.09);border:1px solid rgba(255,60,60,.28);color:#FF7070}
.a-ok{background:rgba(0,255,136,.09);border:1px solid rgba(0,255,136,.28);color:var(--green)}

/* ── Participant cards + drag-and-drop ───────────────── */
.pcard{background:rgba(255,255,255,.048);border:1px solid var(--border);
  border-radius:13px;padding:.875rem;display:flex;align-items:center;gap:.75rem;
  transition:box-shadow .18s,opacity .18s,transform .15s}
.pcard.dragging{opacity:.45;box-shadow:0 0 0 2px var(--hot);transform:scale(.98)}
.pcard.drag-over{box-shadow:0 -3px 0 0 var(--cyan),0 0 0 1px var(--border)}
.drag-handle{cursor:grab;color:var(--muted);font-size:1rem;padding:.2rem .1rem;
  flex-shrink:0;touch-action:none;-webkit-user-select:none;user-select:none;
  display:flex;align-items:center;opacity:.5;transition:opacity .15s}
.drag-handle:hover{opacity:1;color:var(--text)}
.drag-handle:active{cursor:grabbing}
/* Participant + role sub-line */
.pcard-meta{font-size:.78rem;color:var(--muted);font-weight:400;
  margin-top:.18rem;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard-meta .pmeta-name{color:var(--text)}

/* ── Emoji grid picker ───────────────────────────────── */
.egrid{display:grid;grid-template-columns:repeat(8,1fr);
  gap:.3rem;margin-top:.6rem;max-height:160px;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.ebtn{background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:8px;padding:.3rem;cursor:pointer;min-height:38px;
  display:flex;align-items:center;justify-content:center;transition:all .13s}
.ebtn.on{background:rgba(255,45,120,.28);border-color:var(--hot)}

/* ── Point chips ─────────────────────────────────────── */
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.45rem;margin-top:.55rem}
@media(max-width:380px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pchip{height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:1.65rem;cursor:pointer;
  border:2px solid transparent;transition:all .13s;-webkit-user-select:none;user-select:none}
.pchip:active{transform:scale(.9)}
.pchip:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.pc-av{background:rgba(255,255,255,.08);border-color:var(--border);color:var(--text)}
.pc-on{background:linear-gradient(135deg,var(--hot),var(--purple));border-color:var(--hot);color:#fff}
.pc-no{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.05);
  color:rgba(255,255,255,.18);pointer-events:none}

/* ── Progress bar ────────────────────────────────────── */
.prog{background:rgba(255,255,255,.1);border-radius:99px;height:5px;overflow:hidden}
.progf{height:100%;background:linear-gradient(90deg,var(--hot),var(--cyan));
  border-radius:99px;transition:width .4s ease}

/* ── Scoreboard row ──────────────────────────────────── */
.srow{display:flex;align-items:center;gap:.65rem;
  padding:.75rem .9rem;border-radius:13px;position:relative;overflow:hidden;
  transition:background .5s,border .5s}
.srow-lead{background:rgba(255,215,0,.09);border:1px solid rgba(255,215,0,.28)}
.srow-norm{background:rgba(255,255,255,.04);border:1px solid var(--border)}
.srank{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;
  color:var(--muted);width:1.9rem;text-align:center;flex-shrink:0;line-height:1}
.sr1{color:var(--gold)}.sr2{color:#C0C0C0}.sr3{color:#CD7F32}
.sname{font-weight:600;font-size:.9rem;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spts{font-family:'Bebas Neue',sans-serif;font-size:1.75rem;
  flex-shrink:0;min-width:2.8rem;text-align:right;line-height:1}
.sbar{position:absolute;left:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--hot),var(--cyan));transition:width .65s ease}

/* ── Vote badges ─────────────────────────────────────── */
.vbadge{display:inline-flex;align-items:center;gap:.3rem;
  padding:.28rem .65rem;border-radius:20px;font-size:.78rem;font-weight:700;margin:.18rem}
.vb1{background:rgba(100,200,100,.13);color:#64C864;border:1px solid rgba(100,200,100,.28)}
.vb3{background:rgba(100,150,255,.13);color:#6496FF;border:1px solid rgba(100,150,255,.28)}
.vb5{background:rgba(255,180,50,.13);color:#FFB432;border:1px solid rgba(255,180,50,.28)}
.vb8{background:rgba(255,120,50,.13);color:#FF7832;border:1px solid rgba(255,120,50,.28)}
.vb10{background:rgba(255,50,120,.13);color:#FF3278;border:1px solid rgba(255,50,120,.28)}
.vb12{background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,45,120,.18));
  color:var(--gold);border:1px solid rgba(255,215,0,.45);font-size:.88rem}

/* ── Reveal ──────────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .38s ease both}
.aj{font-size:.78rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.an{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.8rem,6vw,2.8rem);color:var(--cyan);letter-spacing:3px;line-height:1.1}
.asub{font-size:.82rem;color:var(--muted);margin:.35rem 0}
.rrows{display:flex;flex-direction:column;gap:.35rem;
  margin:.7rem 0;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rrow{display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .75rem;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  animation:fadeUp .3s ease both}
.rpts{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;
  padding:.05rem .6rem;border-radius:8px;min-width:50px;text-align:center}
.rp12{color:var(--gold);background:rgba(255,215,0,.14);border:1px solid rgba(255,215,0,.38)}
.rp10{color:#FF3278;background:rgba(255,50,120,.14);border:1px solid rgba(255,50,120,.28)}
.rp8{color:#FF7832;background:rgba(255,120,50,.14);border:1px solid rgba(255,120,50,.28)}
.rp5{color:#FFB432;background:rgba(255,180,50,.14);border:1px solid rgba(255,180,50,.28)}
.rp3{color:#6496FF;background:rgba(100,150,255,.14);border:1px solid rgba(100,150,255,.28)}
.rp1{color:#64C864;background:rgba(100,200,100,.14);border:1px solid rgba(100,200,100,.28)}

/* ── Winner ──────────────────────────────────────────── */
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-11px)}}
.crown{font-size:3.2rem;display:block;animation:bounce 1s ease infinite alternate;
  -webkit-text-fill-color:initial}
.wlabel{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.6rem,5vw,2.8rem);color:var(--gold);letter-spacing:4px;margin:.6rem 0 .35rem}
.wname{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(1.8rem,7vw,4rem);
  background:linear-gradient(135deg,var(--gold),var(--hot),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:2px;line-height:1.1}

/* ── Confetti ────────────────────────────────────────── */
.cf{position:fixed;pointer-events:none;
  animation:fall var(--dur,3s) ease-in var(--del,0s) forwards;z-index:9999}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── QR modal ────────────────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:1.25rem;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal{background:#160030;border:1px solid var(--border);border-radius:22px;
  padding:1.75rem;max-width:320px;width:100%;text-align:center;
  animation:fadeUp .28s ease}
.modal-danger{border-color:rgba(255,60,60,.35);background:#1a0010}
.qrbox{background:#fff;border-radius:14px;padding:12px;display:inline-block;margin:.9rem 0}
.qrbox canvas,.qrbox img{display:block}
.urlbox{font-size:.72rem;color:var(--muted);word-break:break-all;
  background:rgba(255,255,255,.05);padding:.5rem .75rem;
  border-radius:9px;border:1px solid var(--border);margin-bottom:1rem;line-height:1.5}

/* ── Misc ────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:.9rem 0}
.ctag{display:inline-block;padding:.2rem .6rem;border-radius:99px;font-size:.73rem;
  font-weight:700;background:rgba(123,47,190,.2);color:#C090FF;border:1px solid rgba(123,47,190,.3)}
.vrow{display:flex;align-items:center;justify-content:space-between;
  padding:.55rem .75rem;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--border)}
.vn{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;color:var(--gold)}
</style>
</head>
<body>
<div id="sf"></div>

/* Ei — Flag/Emoji component. Zero CDN dependency.
   Country flags → inline base64 SVG (works offline, no CORS issues).
   Other emoji   → native text span (works on all modern OS natively). */
function Ei({e,cls,alt}){
  const src=FLAG_IMGS[e];
  if(src){
    const szMap={'ei-sm':20,'ei-md':28,'ei-lg':38,'ei-xl':52,'ei-winner':80};
    const sz=szMap[cls]||28;
    return React.createElement('img',{
      src,alt:alt||e,
      width:sz,height:Math.round(sz*0.67),
      className:'ei '+(cls||'ei-md'),
      draggable:false,
      style:{borderRadius:3,objectFit:'cover',display:'inline-block',verticalAlign:'middle'}
    });
  }
  // Non-flag emoji: render as text — works natively everywhere
  const szMap2={'ei-sm':'1.1rem','ei-md':'1.45rem','ei-lg':'1.9rem',
                'ei-xl':'2.5rem','ei-winner':'3.8rem'};
  return React.createElement('span',{
    role:'img','aria-label':alt||e,
    style:{fontSize:szMap2[cls]||'1.45rem',lineHeight:1,display:'inline-block',verticalAlign:'middle'}
  },e);
}

  const cols=['#FFD700','#FF2D78','#00E5FF','#7B2FBE','#00FF88','#FF6B00','#fff'];
  for(let i=0;i<110;i++){
    const el=document.createElement('div');el.className='cf';
    const s=Math.random()*10+4;
    el.style.cssText=`left:${Math.random()*100}vw;top:-30px;`+
      `width:${s}px;height:${s}px;background:${cols[i%cols.length]};`+
      `border-radius:${Math.random()>.5?'50%':'3px'};`+
      `--dur:${(Math.random()*2+2.4).toFixed(1)}s;`+
      `--del:${(Math.random()*2.2).toFixed(1)}s`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5500);
  }
}

/* ── Confirm Modal ────────────────────────────────────── */
function ConfirmModal({title,message,confirmLabel,onConfirm,onCancel}){
  // Trap focus & close on Escape
  useEffect(()=>{
    const handler=(e)=>{if(e.key==='Escape') onCancel();};
    document.addEventListener('keydown',handler);
    return()=>document.removeEventListener('keydown',handler);
  },[]);
  return h('div',{className:'backdrop',role:'dialog','aria-modal':'true',
    'aria-labelledby':'confirm-title',
    onClick:e=>{if(e.target===e.currentTarget)onCancel()}},
    h('div',{className:'modal modal-danger'},
      h('div',{style:{fontSize:'2.2rem',marginBottom:'.6rem'}},'⚠️'),
      h('div',{id:'confirm-title',style:{
        fontFamily:"'Bebas Neue'",fontSize:'1.4rem',letterSpacing:2,
        color:'#FF7070',marginBottom:'.6rem'
      }},title),
      h('p',{style:{fontSize:'.88rem',color:'var(--muted)',lineHeight:1.6,marginBottom:'1.3rem'}},message),
      h('div',{style:{display:'flex',gap:'.6rem',justifyContent:'center'}},
        h('button',{className:'btn btn-secondary btn-sm',onClick:onCancel,
          style:{flex:1}},'Cancel'),
        h('button',{className:'btn btn-sm',onClick:onConfirm,
          style:{flex:1,background:'rgba(255,60,60,.22)',color:'#FF7070',
            border:'1px solid rgba(255,60,60,.45)',fontWeight:700},
          autoFocus:true},confirmLabel)
      )
    )
  );
}

/* ── QR Modal ─────────────────────────────────────────── */
function QRModal({url,onClose}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!url) return;
    ref.current.innerHTML='';
    try{
      new QRCode(ref.current,{text:url,width:188,height:188,
        colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
    }catch(e){console.warn('QR failed',e)}
  },[url]);
  function copy(){
    if(navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
    else{const t=document.createElement('textarea');t.value=url;
      document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  }
  return h('div',{className:'backdrop',onClick:e=>{if(e.target===e.currentTarget)onClose()},
    role:'dialog','aria-modal':'true','aria-label':'Share QR Code'},
    h('div',{className:'modal'},
      h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:'1.5rem',letterSpacing:2,
        color:'var(--cyan)',marginBottom:'.4rem'}},'📱 SCAN TO VOTE'),
      h('p',{style:{fontSize:'.82rem',color:'var(--muted)',marginBottom:'.1rem'}},
        'Share this with voters — no login needed.'),
      h('div',{className:'qrbox'},h('div',{ref})),
      h('div',{className:'urlbox'},url),
      h('div',{style:{display:'flex',gap:'.5rem',justifyContent:'center'}},
        h('button',{className:'btn btn-secondary btn-sm',onClick:copy},'📋 Copy Link'),
        h('button',{className:'btn btn-secondary btn-sm',onClick:onClose},'✕ Close')
      )
    )
  );
}

   2. Click "Add project" → name it (e.g. "taste-vision") → Continue
   3. Disable Google Analytics → Create project
   4. Click "Realtime Database" in the left menu → Create database

      firebaseConfig object values below and paste them in.
   6. Done — all devices now share state in real time!

   RUNNING WITHOUT FIREBASE (offline / demo mode):
   If firebaseConfig is empty (all fields ''), the app runs
   entirely in local memory exactly as before — no errors.
────────────────────────────────────────────────────────── */
/* ═══════════════════════════════════════════════════════════════════
   TASTE-VISION SONG CONTEST — SETUP GUIDE
   ═══════════════════════════════════════════════════════════════════

   This application requires a FREE Firebase account to enable
   real-time voting across multiple devices. Follow the steps below
   to connect your own database. Takes about 5 minutes.

   ── STEP 1: Create a Firebase project ───────────────────────────
   1. Go to https://console.firebase.google.com
   2. Click "Add project"
   3. Give it a name (e.g. "my-song-contest")
   4. Click Continue → you can enable or disable Google Analytics
   5. Click "Create project" and wait for it to finish

   ── STEP 2: Create a Realtime Database ──────────────────────────
   1. In the left sidebar click "Build" → "Realtime Database"
   2. Click "Create database"
   3. Choose your region (pick the one closest to your event location)
   4. Select "Start in test mode" → click "Enable"
   5. Your database is now live

   ── STEP 3: Get your Firebase config values ──────────────────────
   1. Click the ⚙ gear icon (top left) → "Project settings"
   2. Scroll down to "Your apps"
   3. Click the </> (Web) icon
   4. Enter any app nickname (e.g. "contest-app") → click "Register app"
   5. Firebase will show you a config block — copy the values from it
      into the FIREBASE_CONFIG object below

   ── STEP 4: Fill in your values below ───────────────────────────
   Replace each empty string '' with the value from your Firebase
   config. Keep the quotes. Do NOT share this file publicly once
   your values are filled in (it contains your API credentials).

   ── STEP 5: Deploy ──────────────────────────────────────────────
   1. Save this file
   2. Go to https://app.netlify.com/drop
   3. Drag and drop this file onto the page
   4. Netlify gives you a public URL — share it with your voters!
   5. Show the QR code from the Host panel for easy mobile access

   ── SECURITY NOTE ───────────────────────────────────────────────
   Your database starts in "test mode" which allows anyone with the
   URL to read and write. This is fine for a private event. After
   your event, go to Firebase Console → Realtime Database → Rules
   and set ".write" to false to lock it down.

   ── TROUBLESHOOTING ─────────────────────────────────────────────
   • "Voting Closed" on voter phones → make sure the host has
     clicked "Open Voting" in the Host Panel
   • Votes not syncing → check that databaseURL is filled in below
     and that your Firebase project has Realtime Database enabled
   • Flags not showing → you need an internet connection; the flag
     images are loaded as inline SVGs so they always render
   • App shows spinner indefinitely → your Firebase config has an
     error; double-check all values are copied correctly

   ═══════════════════════════════════════════════════════════════ */

const FIREBASE_CONFIG = {
  apiKey:            '',   // e.g. 'AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
  authDomain:        '',   // e.g. 'my-project-12345.firebaseapp.com'
  databaseURL:       '',   // e.g. 'https://my-project-12345-default-rtdb.firebaseio.com'
  projectId:         '',   // e.g. 'my-project-12345'
  storageBucket:     '',   // e.g. 'my-project-12345.appspot.com'
  messagingSenderId: '',   // e.g. '123456789012'
  appId:             '',   // e.g. '1:123456789012:web:abcdef1234567890'
  measurementId:     ''    // e.g. 'G-XXXXXXXXXX' (optional, only if Analytics enabled)
};

// Initialise Firebase — deferred so SDKs are guaranteed loaded
let db = null;
let _fbInitDone = false;

function initFirebase(){
  if(_fbInitDone) return;
  if(!FIREBASE_CONFIG.databaseURL) return; // offline/demo mode
  if(typeof firebase === 'undefined') return; // SDK not ready yet, retry scheduled
  _fbInitDone = true;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    if(FIREBASE_CONFIG.measurementId) firebase.analytics();
    console.log('[TasteVision] Firebase connected ✓ | Analytics active');
  }catch(e){
    console.warn('[TasteVision] Firebase init failed, running in offline mode:', e.message);
    db = null;
  }
}

// Three-stage retry: immediate → DOMContentLoaded → window.load
// Handles all network timing scenarios without any error messages
initFirebase();
document.addEventListener('DOMContentLoaded', initFirebase);
window.addEventListener('load', initFirebase);

// Helpers: read/write to Firebase or fall back to local setter
function fbSet(path, value){
  if(db) db.ref(path).set(value);
}
function fbOn(path, cb){
  if(!db) return ()=>{};
  const ref = db.ref(path);
  ref.on('value', snap => cb(snap.val()));
  return () => ref.off('value');
}

/* ── APP ──────────────────────────────────────────────── */
function App(){
  const [view,setView]   = useState('home');
  const [parts,setParts] = useState(DEFAULTS);
  const [votes,setVotes] = useState([]);
  const [open,setOpen]   = useState(false);
  const [reveal,setReveal]   = useState(null);
  const [anonymous,setAnonymous] = useState(false);
  const [voter,setVoter]     = useState(null);
  const [voted,setVoted]     = useState(false);
  const [showQR,setShowQR]   = useState(false);
  const [voterEntry,setVoterEntry] = useState(false);
  const [voterName,setVoterName]   = useState('');
  // fbReady: true if no Firebase config (offline mode), false while connecting
  const [fbReady,setFbReady] = useState(!FIREBASE_CONFIG.databaseURL);

  const url = window.location.href.split('?')[0].split('#')[0];

  // ── Subscribe to Firebase state on mount ─────────────────
  useEffect(()=>{
    // Ensure Firebase is initialised (handles the case where
    // the SDK scripts hadn't loaded yet when the IIFE first ran)
    initFirebase();

    // If still no db after init attempt (no config / SDK failed), go offline
    if(!db){
      setFbReady(true); // show app immediately in offline mode
      return;
    }

    const subs = [];
    subs.push(fbOn('session/open',   v => { if(v!==null) setOpen(!!v); }));
    subs.push(fbOn('session/parts',  v => { if(v) setParts(v); }));
    subs.push(fbOn('session/anonymous', v => { if(v!==null) setAnonymous(!!v); }));
    subs.push(fbOn('votes', v => {
      if(v) setVotes(Object.values(v));
      else  setVotes([]);
    }));

    // Mark ready after first read so voters never flash "Voting Closed"
    db.ref('session/open').once('value').then(()=>setFbReady(true));

    return () => subs.forEach(unsub => unsub());
  }, []);

  // ── Write helpers (push to Firebase + update local state) ─
  function setOpenSync(val){
    setOpen(val);
    fbSet('session/open', val);
  }
  function setPartsSync(valOrFn){
    setParts(prev=>{
      const next = typeof valOrFn==='function' ? valOrFn(prev) : valOrFn;
      fbSet('session/parts', next);
      return next;
    });
  }
  function setAnonymousSync(val){
    setAnonymous(val);
    fbSet('session/anonymous', val);
  }
  function addVote(id,label,asgn){
    const v = {id:uid(),vid:id,label,asgn};
    setVotes(prev=>[...prev,v]);
    if(db) db.ref('votes/'+v.id).set(v);
  }

  function scores(){
    const sc={};parts.forEach(p=>{sc[p.id]=0});
    votes.forEach(v=>Object.entries(v.asgn).forEach(([pid,pts])=>{
      if(sc[pid]!==undefined) sc[pid]+=pts;
    }));
    return sc;
  }
  function buildSeq(){
    return votes.map(v=>({
      vid:v.vid,
      label:v.label,
      rows:Object.entries(v.asgn).sort((a,b)=>a[1]-b[1]).map(([pid,pts])=>({pid,pts}))
    }));
  }
  function startReveal(){setReveal({seq:buildSeq(),idx:0});setView('reveal');}
  function demo(){
    const dv=parts.map(p=>{
      const others=[...parts.filter(o=>o.id!==p.id)].sort(()=>Math.random()-.5);
      const asgn={};
      PTS.forEach((pts,i)=>{if(others[i]) asgn[others[i].id]=pts});
      return {id:uid(),vid:'d_'+p.id,label:p.name,asgn};
    });
    setVotes(dv);
    setOpenSync(false);
    if(db) dv.forEach(v=>db.ref('votes/'+v.id).set(v));
  }
  function resetVoting(){
    setVotes([]);
    setOpenSync(false);
    setReveal(null);
    setVoted(false);
    setVoter(null);
    if(db) db.ref('votes').remove();
  }
  function joinVoter(name){setVoter({id:uid(),name});setVoted(false);setView('voter');}

  // Show loading spinner until Firebase delivers first state
  if(!fbReady) return h('div',{style:{
    minHeight:'100svh',display:'flex',flexDirection:'column',
    alignItems:'center',justifyContent:'center',gap:'1rem',
    background:'var(--dark)',color:'var(--muted)',fontFamily:"'Outfit',sans-serif"
  }},
    h(BrandHeader,{compact:true}),
    h('div',{style:{fontSize:'.85rem',letterSpacing:'.1em',marginTop:'.5rem'}},
      'Connecting to session...'),
    h('div',{style:{
      width:36,height:36,borderRadius:'50%',marginTop:'.5rem',
      border:'3px solid var(--border)',borderTopColor:'var(--cyan)',
      animation:'spin .8s linear infinite'
    }})
  );

  return h(React.Fragment,null,
    view==='home'   && h(Home,{setView,open,voterEntry,setVoterEntry,voterName,setVoterName,joinVoter,onQR:()=>setShowQR(true)}),
    view==='host'   && h(Host,{parts,setParts:setPartsSync,votes,open,setOpen:setOpenSync,startReveal,demo,resetVoting,setView,scores,onQR:()=>setShowQR(true)}),
    view==='voter'  && h(Voter,{parts,voter,addVote,setView,voted,setVoted,open}),
    view==='reveal' && h(Reveal,{reveal,setReveal,parts,setView,anonymous,setAnonymous:setAnonymousSync,votes}),
    showQR && h(QRModal,{url,onClose:()=>setShowQR(false)})
  );
}

function FlagPicker({selected,onSelect}){

  const match=e=>!q||(COUNTRY_NAMES[e]&&COUNTRY_NAMES[e].toLowerCase().includes(q));
  const regions=q?[{label:'Search results',flags:Object.keys(FLAG_IMGS).filter(match)}]:FLAG_REGIONS;
  return h('div',{style:{marginTop:'.6rem',background:'rgba(0,0,0,.25)',borderRadius:12,

/* ── HOST ───────────────────────────────────────────────────── */
function Host({parts,setParts,votes,open,setOpen,startReveal,demo,resetVoting,setView,scores,onQR}){
  const [tab,setTab]=useState('countries');
  const [name,setName]=useState('');
  const [participant,setParticipant]=useState('');
  const [role,setRole]=useState('');
  const [flag,setFlag]=useState('🌍');
  const [showEmoji,setShowEmoji]=useState(false);
  const [editId,setEditId]=useState(null);
  const [showConfirm,setShowConfirm]=useState(false);
  const [dragSrc,setDragSrc]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const touchSrc=useRef(null);
  const formRef=useRef(null);
  const sc=scores();

  function save(){
    if(!name.trim()) return;
    if(editId){
      setParts(ps=>ps.map(p=>p.id===editId
        ?{...p,name:name.trim(),flag,participant:participant.trim(),role:role.trim()}
        :p));
      setEditId(null);
    } else {
      setParts(ps=>[...ps,{id:uid(),name:name.trim(),flag,
        participant:participant.trim(),role:role.trim()}]);
    }
    setName('');setParticipant('');setRole('');setFlag('🌍');setShowEmoji(false);
  }
  function edit(p){
    setEditId(p.id);setName(p.name);setFlag(p.flag);
    setParticipant(p.participant||'');setRole(p.role||'');
    setShowEmoji(false);
    requestAnimationFrame(()=>{
      if(formRef.current) formRef.current.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }
  function cancel(){setEditId(null);setName('');setParticipant('');setRole('');setFlag('🌍');}
  function handleReset(){resetVoting();setShowConfirm(false);}

  function reorder(from,to){
    if(from===to||from===null||to===null) return;
    setParts(ps=>{const next=[...ps];const [m]=next.splice(from,1);next.splice(to,0,m);return next;});
  }
  function onDragStart(e,i){setDragSrc(i);e.dataTransfer.effectAllowed='move';}
  function onDragEnter(i){setDragOver(i);}
  function onDragOver(e){e.preventDefault();}
  function onDragEnd(){reorder(dragSrc,dragOver);setDragSrc(null);setDragOver(null);}
  function onTouchStart(e,i){touchSrc.current=i;}
  function onTouchMove(e){
    e.preventDefault();
    const t=e.touches[0];
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const card=el&&el.closest('[data-didx]');
    if(card){const idx=parseInt(card.getAttribute('data-didx'));if(!isNaN(idx))setDragOver(idx);}
  }
  function onTouchEnd(){reorder(touchSrc.current,dragOver);touchSrc.current=null;setDragOver(null);}

  const sorted=[...parts].map(p=>({...p,score:sc[p.id]||0})).sort((a,b)=>b.score-a.score);
  const max=Math.max(...sorted.map(s=>s.score),1);

  return h(React.Fragment,null,
    showConfirm&&h(ConfirmModal,{
      title:'RESTART VOTING?',
      message:'This will erase all '+votes.length+' submitted vote'+(votes.length!==1?'s':'')+'. Countries and participants stay. Scores reset to zero. This cannot be undone.',
      confirmLabel:'🗑 Yes, Reset Votes',
      onConfirm:handleReset,onCancel:()=>setShowConfirm(false)
    }),
    h('div',{className:'screen'},
      h('div',{className:'rowb',style:{marginBottom:'1.1rem'}},
        h('div',null,
          h('span',{className:'logo',style:{fontSize:'1.5rem'}},'🎛️ HOST PANEL'),
          h('div',{className:'tagline'},'Event Manager')
        ),
        h('div',{className:'row',style:{gap:'.4rem'}},
          h('button',{className:'btn btn-secondary btn-xs',onClick:onQR},'📱 QR'),
          h('button',{className:'btn btn-secondary btn-xs',onClick:()=>setView('home')},'← Home')
        )
      ),
      h('div',{className:'card card-xs rowb',style:{marginBottom:'.85rem'}},
        h('div',{className:'row',style:{gap:'.6rem'}},
          h('span',{className:'pill '+(open?'pill-on':'pill-off')},
            h('span',{className:'dot'}),open?'Voting Open':'Closed'),
          h('span',{style:{fontSize:'.8rem',color:'var(--muted)'}},
            votes.length,' vote'+(votes.length!==1?'s':''))
        ),
        h('div',{className:'row',style:{gap:'.35rem',flexWrap:'wrap'}},
          h('button',{className:'btn btn-xs '+(open?'btn-danger':'btn-secondary'),onClick:()=>setOpen(!open)},
            open?'🔒 Close':'🔓 Open'),
          h('button',{className:'btn btn-xs btn-secondary',onClick:demo},'🎲 Demo'),
          h('button',{className:'btn btn-xs btn-gold',onClick:startReveal,disabled:votes.length===0},'▶ Reveal'),
          h('button',{className:'btn btn-xs btn-danger',onClick:()=>setShowConfirm(true),
            disabled:votes.length===0,'aria-label':'Restart voting'},'🔄 Restart')
        )
      ),
      h('nav',{className:'tabs',role:'tablist'},
        [['countries','🌍 Countries'],['scores','🏆 Scores'],['ballots','🗳️ Ballots']].map(([k,lbl])=>
          h('button',{key:k,className:'tab '+(tab===k?'on':''),role:'tab',
            'aria-selected':tab===k,onClick:()=>setTab(k)},lbl)
        )
      ),

      /* COUNTRIES */
      tab==='countries'&&h('div',null,
        h('div',{className:'card',style:{marginBottom:'.85rem'},ref:formRef},
          h('div',{className:'stitle',style:{marginBottom:'.7rem'}},editId?'✏️ Edit':'➕ Add'),
          h('div',{style:{display:'flex',gap:'.45rem',flexWrap:'wrap',alignItems:'flex-start'}},
            h('button',{className:'btn btn-secondary',
              style:{minWidth:48,padding:'.5rem',borderRadius:10,flexShrink:0},
              onClick:()=>setShowEmoji(!showEmoji),'aria-label':'Pick flag: '+flag,'aria-expanded':showEmoji},
              h(Ei,{e:flag,cls:'ei-md',alt:flag})
            ),
            h('div',{style:{flex:1,display:'flex',flexDirection:'column',gap:'.4rem',minWidth:120}},
              h('input',{type:'text',placeholder:'Country name',value:name,
                onChange:e=>setName(e.target.value),onKeyDown:e=>e.key==='Enter'&&save(),
                autoCapitalize:'words','aria-label':'Country name'}),
              h('input',{type:'text',placeholder:'Participant name (optional)',value:participant,
                onChange:e=>setParticipant(e.target.value),onKeyDown:e=>e.key==='Enter'&&save(),
                autoCapitalize:'words','aria-label':'Participant name'}),
              h('input',{type:'text',placeholder:'Role (optional)',value:role,
                onChange:e=>setRole(e.target.value),onKeyDown:e=>e.key==='Enter'&&save(),
                autoCapitalize:'words','aria-label':'Role'})
            ),
            h('div',{style:{display:'flex',flexDirection:'column',gap:'.4rem',flexShrink:0}},
              h('button',{className:'btn btn-primary btn-sm',onClick:save,
                disabled:!name.trim(),style:{minHeight:48}},editId?'Save':'Add'),
              editId&&h('button',{className:'btn btn-secondary btn-sm',onClick:cancel},'✕')
            )
          ),
          showEmoji&&h(FlagPicker,{selected:flag,onSelect:e=>{setFlag(e);setShowEmoji(false)}})
        ),
        parts.length===0&&h('div',{className:'alert a-warn'},'No participants yet. Add some above!'),
        parts.length>1&&h('div',{style:{fontSize:'.72rem',color:'var(--muted)',
          marginBottom:'.45rem',textAlign:'center',letterSpacing:'.05em'}},'↕️ Drag to reorder'),
        h('div',{className:'col'},
          parts.map((p,i)=>h('div',{
            key:p.id,
            className:'pcard'+(dragSrc===i?' dragging':'')+(dragOver===i&&dragSrc!==i?' drag-over':''),
            draggable:true,'data-didx':i,
            onDragStart:e=>onDragStart(e,i),onDragEnter:()=>onDragEnter(i),
            onDragOver,onDragEnd,
            onTouchStart:e=>onTouchStart(e,i),onTouchMove,onTouchEnd,
            style:{touchAction:'none'}
          },
            h('span',{className:'drag-handle','aria-hidden':'true'},'⋮⋮'),
            h(Ei,{e:p.flag,cls:'ei-lg',alt:p.name+' flag'}),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{fontWeight:600,fontSize:'.93rem',overflow:'hidden',
                textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.name),
              (p.participant||p.role)&&h('div',{className:'pcard-meta'},
                p.participant&&h('span',{className:'pmeta-name'},p.participant),
                p.participant&&p.role&&h('span',null,' · '),
                p.role&&h('span',null,p.role)
              ),
              h('div',{style:{fontSize:'.7rem',color:'var(--muted)',marginTop:'.15rem'}},
                sc[p.id]||0,' pts so far')
            ),
            h('div',{className:'row',style:{gap:'.3rem'}},
              h('button',{className:'btn btn-secondary btn-xs',onClick:()=>edit(p),
                'aria-label':'Edit '+p.name},'✏️'),
              h('button',{className:'btn btn-danger btn-xs',
                onClick:()=>setParts(ps=>ps.filter(x=>x.id!==p.id)),
                'aria-label':'Remove '+p.name},'🗑')
            )
          ))
        )
      ),

      /* SCORES */
      tab==='scores'&&h('div',null,
        sorted.length===0&&h('div',{className:'alert a-warn'},'No votes yet — try Demo!'),
        h('div',{className:'col'},
          sorted.map((p,i)=>h('div',{key:p.id,
            className:'srow '+(i===0&&p.score>0?'srow-lead':'srow-norm')},
            h('div',{className:'srank '+(i===0?'sr1':i===1?'sr2':i===2?'sr3':'')},i+1),
            h(Ei,{e:p.flag,cls:'ei-md',alt:p.name}),
            h('div',{style:{flex:1,minWidth:0,overflow:'hidden'}},
              h('div',{style:{fontWeight:600,fontSize:'.9rem',overflow:'hidden',
                textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.name),
              (p.participant||p.role)&&h('div',{className:'pcard-meta',style:{marginTop:'.1rem'}},
                p.participant&&h('span',{className:'pmeta-name'},p.participant),
                p.participant&&p.role&&h('span',null,' · '),
                p.role&&h('span',null,p.role)
              )
            ),
            h('div',{className:'spts',style:{color:i===0&&p.score>0?'var(--gold)':'var(--text)'}},p.score),
            h('div',{className:'sbar','aria-hidden':'true',style:{width:(p.score/max*100)+'%'}})
          ))
        )
      ),

      /* BALLOTS */
      tab==='ballots'&&h('div',null,
        votes.length===0&&h('div',{className:'alert a-warn'},'No votes submitted yet.'),
        h('div',{className:'col'},
          votes.map(v=>h('div',{key:v.id,className:'card card-sm'},
            h('div',{className:'rowb',style:{marginBottom:'.55rem'}},
              h('div',{style:{fontWeight:700,fontSize:'.88rem'}},'🗳️ '+v.label),
              h('span',{className:'ctag'},Object.keys(v.asgn).length+' pts')
            ),
            h('div',{style:{display:'flex',flexWrap:'wrap'}},
              Object.entries(v.asgn).sort((a,b)=>b[1]-a[1]).map(([pid,pts])=>{
                const p=parts.find(x=>x.id===pid);
                return p&&h('span',{key:pid,className:'vbadge '+(VBCLS[pts]||'vb1')},
                  h(Ei,{e:p.flag,cls:'ei-sm',alt:p.name}),
                  ' ',p.name,' • ',pts
                );
              })
            )
          ))
        )
      )
    )
  );
}


/* ── VOTER ────────────────────────────────────────────── */
function Voter({parts,voter,addVote,setView,voted,setVoted,open}){
  const [asgn,setAsgn]=useState({});
  const [active,setActive]=useState(null);
  const [err,setErr]=useState('');
  const [done,setDone]=useState(false);

  const used=new Set(Object.values(asgn));
  const allDone=PTS.every(p=>used.has(p));
  const count=Object.keys(asgn).length;

  function assign(pid,pts){
    setErr('');
    setAsgn(prev=>{
      const n={...prev};
      if(n[pid]===pts){delete n[pid];return n;}
      const had=Object.entries(n).find(([,v])=>v===pts);
      if(had) delete n[had[0]];
      n[pid]=pts;
      return n;
    });
  }
  function submit(){
    if(!allDone){setErr('Assign all 6 values: 1, 3, 5, 8, 10 and 12 points.');return;}
    addVote(voter.id,voter.name,asgn);setDone(true);setVoted(true);
  }

  if(!open&&!done&&!voted)
    return h('div',{className:'screen center'},
      h(BrandHeader,{compact:true}),
      h('div',{className:'card',style:{padding:'2.2rem 1.25rem'}},
        h('div',{style:{fontSize:'2.6rem',marginBottom:'.7rem'}},'🔒'),
        h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:'1.55rem',letterSpacing:2,
          color:'var(--orange)',marginBottom:'.6rem'}},'VOTING IS CLOSED'),
        h('p',{style:{color:'var(--muted)',fontSize:'.88rem',marginBottom:'1.3rem'}},
          'The host has not opened voting yet. Please wait!'),
        h('button',{className:'btn btn-secondary btn-full',onClick:()=>setView('home')},'← Home')
      )
    );

  if(done||voted)
    return h('div',{className:'screen'},
      h(BrandHeader,{compact:true}),
      h('div',{className:'card center',style:{padding:'1.75rem 1.25rem'}},
        h('div',{style:{fontSize:'2.8rem',marginBottom:'.65rem'}},'✅'),
        h('div',{style:{fontFamily:"'Bebas Neue'",fontSize:'1.75rem',letterSpacing:2,
          color:'var(--green)',marginBottom:'.55rem'}},'VOTES SUBMITTED!'),
        h('p',{style:{color:'var(--muted)',fontSize:'.86rem',marginBottom:'1.2rem'}},
          "You're done! Await the host's dramatic reveal."),
        h('div',{className:'col',style:{textAlign:'left',marginBottom:'1.1rem'}},
          Object.entries(asgn).sort((a,b)=>b[1]-a[1]).map(([pid,pts])=>{
            const p=parts.find(x=>x.id===pid);
            return p&&h('div',{key:pid,className:'vrow'},
              h('div',{className:'row',style:{gap:'.5rem'}},
                h(Ei,{e:p.flag,cls:'ei-sm',alt:p.name}),
                h('span',{style:{fontWeight:600,fontSize:'.88rem'}},p.name)
              ),
              h('div',{className:'vn'},pts,' pts')
            );
          })
        ),
        h('button',{className:'btn btn-secondary btn-full',onClick:()=>setView('home')},'← Home')
      )
    );

  return h('div',{className:'screen'},
    h('div',{className:'rowb',style:{marginBottom:'1.1rem'}},
      h('div',null,
        h('h1',{style:{fontFamily:"'Bebas Neue'",fontSize:'1.5rem',letterSpacing:2,
          background:'linear-gradient(135deg,var(--gold),var(--hot))',
          WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'🗳️ YOUR BALLOT'),
        h('div',{className:'tagline'},voter.name)
      ),
      h('button',{className:'btn btn-secondary btn-xs',onClick:()=>setView('home')},'✕ Exit')
    ),
    h('div',{className:'card card-xs',style:{marginBottom:'.85rem'}},
      h('div',{className:'rowb',style:{marginBottom:'.35rem'}},
        h('span',{style:{fontSize:'.78rem',color:'var(--muted)'}},'Assigned '+count+' / 6'),
        h('div',{style:{display:'flex',gap:'.28rem'}},
          PTS.map(p=>h('div',{key:p,style:{
            width:24,height:24,borderRadius:5,display:'flex',
            alignItems:'center',justifyContent:'center',fontSize:'.68rem',fontWeight:700,
            background:used.has(p)?'rgba(255,215,0,.18)':'rgba(255,255,255,.06)',
            color:used.has(p)?'var(--gold)':'var(--muted)',
            border:'1px solid '+(used.has(p)?'rgba(255,215,0,.4)':'var(--border)')
          }},p))
        )
      ),
      h('div',{className:'prog'},h('div',{className:'progf',style:{width:(count/6*100)+'%'}}))
    ),
    err && h('div',{className:'alert a-err',role:'alert',style:{marginBottom:'.75rem'}},err),
    h('div',{className:'col'},
      parts.map(p=>{
        const self=p.name.toLowerCase()===voter.name.toLowerCase();
        const curPts=asgn[p.id];
        const isOpen=active===p.id;
        return h('div',{key:p.id,className:'card card-sm',
          style:{opacity:self?.38:1,
            border:isOpen?'1px solid var(--hot)':curPts?'1px solid rgba(255,215,0,.32)':'1px solid var(--border)',
            transition:'border .2s'}},
          h('div',{className:'rowb',style:{marginBottom:isOpen&&!self?'.6rem':0}},
            h('div',{className:'row'},
              /* Big flag per participant — clear on all mobile browsers */
              h(Ei,{e:p.flag,cls:'ei-lg',alt:p.name+' flag'}),
              h('div',{style:{minWidth:0}},
                h('div',{style:{display:'flex',alignItems:'baseline',gap:'.35rem',flexWrap:'wrap'}},
                  h('span',{style:{fontWeight:600,fontSize:'.9rem',overflow:'hidden',
                    textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.name),
                  (p.participant||p.role)&&h('span',{style:{fontSize:'.75rem',color:'var(--muted)',
                    fontWeight:400,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
                    [p.participant,p.role].filter(Boolean).join(' · '))
                ),
                self ? h('div',{style:{fontSize:'.7rem',color:'var(--muted)',marginTop:'.15rem'}},'Cannot vote for yourself') :
                curPts ? h('div',{style:{fontSize:'.78rem',color:'var(--gold)',fontWeight:700,
                  marginTop:'.15rem','aria-live':'polite'}},curPts+' pts ✓') :
                h('div',{style:{fontSize:'.7rem',color:'var(--muted)',marginTop:'.15rem'}},'Tap to assign points')
              )
            ),
            !self && h('button',{
              className:'btn btn-xs '+(isOpen?'btn-danger':'btn-secondary'),
              onClick:()=>setActive(isOpen?null:p.id),
              'aria-expanded':isOpen,'aria-controls':'pts-'+p.id
            },isOpen?'✕':'Assign')
          ),
          isOpen&&!self && h('div',{id:'pts-'+p.id,className:'pgrid',
            role:'group','aria-label':'Assign points to '+p.name},
            PTS.map(pts=>{
              const sel=asgn[p.id]===pts;
              const busy=used.has(pts)&&!sel;
              return h('button',{key:pts,
                className:'pchip '+(sel?'pc-on':busy?'pc-no':'pc-av'),
                onClick:()=>{if(!busy){assign(p.id,pts);if(!sel)setActive(null);}},
                disabled:busy,
                'aria-label':pts+' pts'+(sel?' selected':busy?' taken':''),
                'aria-pressed':sel
              },pts);
            })
          )
        );
      })
    ),
    h('div',{style:{marginTop:'1.1rem'}},
      !allDone && h('div',{className:'alert a-warn',role:'status',style:{marginBottom:'.75rem'}},
        'Assign all 6 values (1, 3, 5, 8, 10, 12) to submit.'),
      h('button',{className:'btn btn-gold btn-full',
        style:{fontSize:'1.05rem',minHeight:54},
        onClick:submit,disabled:!allDone},'🏆 Submit My Votes')
    )
  );
}

/* ── REVEAL ─────────────────────────────────────────────── */
function Reveal({reveal,setReveal,parts,setView,anonymous,setAnonymous,votes}){
  const [current,setCurrent]=useState(null);
  const [rscores,setRscores]=useState({});
  const [done,setDone]=useState(false);
  const [auto,setAuto]=useState(false);
  const [busy,setBusy]=useState(false);
  const t1=useRef(null);const t2=useRef(null);

  const {seq,idx}=reveal;
  const prog=seq.length>0?Math.round(idx/seq.length*100):0;

  // Build stable anonymous label map: vid -> "Toastmaster N"
  // Derived from votes order so labels are consistent throughout session
  const anonMap=React.useMemo(()=>{
    const map={};
    votes.forEach((v,i)=>{map[v.vid]='Toastmaster '+(i+1);});
    return map;
  },[votes]);

  function displayLabel(block){
    if(!anonymous) return block.label;
    return anonMap[block.vid]||block.label;
  }

  useEffect(()=>()=>{clearTimeout(t1.current);clearTimeout(t2.current)},[]);
  useEffect(()=>{
    if(auto&&!done&&!busy){t2.current=setTimeout(next,3500);}
    return()=>clearTimeout(t2.current);
  },[auto,done,busy,idx]);

  function next(){
    if(done||idx>=seq.length) return;
    const block=seq[idx];
    setCurrent(block);setBusy(true);
    setRscores(prev=>{
      const n={...prev};
      block.rows.forEach(({pid,pts})=>{n[pid]=(n[pid]||0)+pts;});
      return n;
    });
    const ni=idx+1;
    setReveal(r=>({...r,idx:ni}));
    if(ni>=seq.length){
      t1.current=setTimeout(()=>{setDone(true);setBusy(false);doConfetti();},2200);
    } else {
      t1.current=setTimeout(()=>setBusy(false),2900);
    }
  }

  const sorted=[...parts].map(p=>({...p,score:rscores[p.id]||0})).sort((a,b)=>b.score-a.score);
  const max=Math.max(...sorted.map(s=>s.score),1);
  const winner=sorted[0];

  return h('div',{className:'reveal-screen'},
    /* ── Header ── */
    h('div',{className:'rowb reveal-header'},
      h('h1',{className:'logo',style:{fontSize:'1.3rem',letterSpacing:3}},'📺 VOTE REVEAL'),
      h('button',{className:'btn btn-secondary btn-xs',
        onClick:()=>{clearTimeout(t1.current);clearTimeout(t2.current);setView('host')}},
        '← Host')
    ),

    /* ── Controls strip (full width above both columns) ── */
    h('div',{className:'card card-xs',style:{marginBottom:'.75rem'}},
      h('div',{className:'rowb',style:{marginBottom:'.35rem',flexWrap:'wrap',gap:'.4rem'}},
        h('span',{style:{fontSize:'.78rem',color:'var(--muted)'}},'Jury '+idx+' / '+seq.length),
        h('div',{className:'row',style:{gap:'.5rem',flexWrap:'wrap'}},
          /* Anonymous toggle sits inline with playback controls */
          h('div',{className:'row',style:{gap:'.4rem',
            paddingRight:'.6rem',borderRight:'1px solid var(--border)'}},
            h('span',{style:{fontSize:'.75rem',color:'var(--muted)',fontWeight:600}},'\uD83D\uDD75\uFE0F Anon'),
            h('label',{className:'toggle-wrap',
              'aria-label':anonymous?'Disable anonymous voting':'Enable anonymous voting'},
              h('input',{type:'checkbox',checked:anonymous,onChange:()=>setAnonymous(!anonymous),
                style:{position:'absolute',opacity:0,width:0,height:0},'aria-hidden':'true'}),
              h('div',{className:'toggle-track '+(anonymous?'on':'')},h('div',{className:'toggle-thumb'})),
              h('span',{className:'toggle-label',style:{fontSize:'.72rem',minWidth:'1.5rem'}},
                anonymous?'On':'Off')
            )
          ),
          h('button',{className:'btn btn-xs btn-secondary',onClick:()=>setAuto(!auto),'aria-pressed':auto},
            auto?'⏸ Pause':'▶ Auto'),
          !done&&h('button',{className:'btn btn-xs btn-gold',onClick:next,disabled:busy||done},'Next Jury →')
        )
      ),
      h('div',{className:'prog'},h('div',{className:'progf',style:{width:prog+'%'}}))
    ),

    /* ── Two-column body ── */
    h('div',{className:'reveal-body'},

      /* LEFT: Announcement panel */
      h('div',{className:'reveal-left'},
        h('div',{className:'card announce-card',
          'aria-live':'assertive','aria-atomic':'true'},

          done ?
            h('div',{className:'center fu',style:{width:'100%',padding:'.75rem 1rem'}},
              h('span',{className:'crown'},'👑'),
              h('div',{className:'wlabel'},'WINNER'),
              h('div',{style:{display:'flex',justifyContent:'center',margin:'.4rem 0'}},
                h(Ei,{e:winner.flag,cls:'ei-winner',alt:winner.name+' flag'})
              ),
              winner.participant&&h('div',{style:{fontSize:'.85rem',color:'var(--muted)',marginBottom:'.2rem'}},
                winner.participant+(winner.role?' \u00B7 '+winner.role:'')),
              h('div',{className:'wname'},winner.name),
              h('div',{style:{color:'var(--gold)',fontFamily:"'Bebas Neue'",fontSize:'2rem',
                margin:'.4rem 0 1rem'}},winner.score,' POINTS'),
              h('div',{style:{display:'flex',gap:'.5rem',justifyContent:'center',flexWrap:'wrap'}},
                h('button',{className:'btn btn-secondary btn-sm',
                  onClick:()=>{clearTimeout(t1.current);clearTimeout(t2.current);setView('host')}},
                  '\u2190 Host Panel'),
                h('button',{className:'btn btn-gold btn-sm',onClick:doConfetti},'\uD83C\uDF8A Celebrate!')
              )
            ) :

          current ?
            h('div',{className:'fu',style:{width:'100%',padding:'1rem'}},
              h('div',{className:'aj'},'Votes from'),
              h('div',{className:'an'},displayLabel(current)),
              h('div',{className:'asub'},'awards points to...'),
              h('div',{className:'rrows'},
                [...current.rows].sort((a,b)=>b.pts-a.pts).map(({pid,pts},i)=>{
                  const p=parts.find(x=>x.id===pid);
                  return p&&h('div',{key:pid,className:'rrow',style:{animationDelay:(i*.07)+'s'}},
                    h('div',{className:'row',style:{gap:'.5rem'}},
                      h(Ei,{e:p.flag,cls:'ei-md',alt:p.name}),
                      h('div',{style:{minWidth:0}},
                        h('div',{style:{fontWeight:600,fontSize:'.88rem',overflow:'hidden',
                          textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.name),
                        (p.participant||p.role)&&h('div',{className:'pcard-meta',style:{marginTop:'.05rem'}},
                          p.participant&&h('span',{className:'pmeta-name'},p.participant),
                          p.participant&&p.role&&h('span',null,' \u00B7 '),
                          p.role&&h('span',null,p.role)
                        )
                      )
                    ),
                    h('div',{className:'rpts '+(RPCLS[pts]||'rp1')},pts)
                  );
                })
              )
            ) :

            h('div',{className:'center',style:{color:'var(--muted)',padding:'2rem 1rem'}},
              h('div',{style:{fontSize:'2rem',marginBottom:'.6rem'}},'\uD83C\uDFAC'),
              h('div',{style:{fontSize:'.88rem'}},'Press "Next Jury" or tap Auto to start!')
            )
        )
      ),

      /* RIGHT: Live scoreboard — scrollable independently on desktop */
      h('div',{className:'reveal-right',role:'region','aria-label':'Live scoreboard'},
        h('div',{className:'stitle',style:{marginBottom:'.5rem',fontSize:'1.2rem'}},'\uD83C\uDFC6 SCOREBOARD'),
        h('div',{className:'col',style:{gap:'.4rem'}},
          sorted.map((p,i)=>h('div',{key:p.id,
            className:'srow srow-compact '+(i===0&&p.score>0?'srow-lead':'srow-norm')},
            h('div',{className:'srank '+(i===0?'sr1':i===1?'sr2':i===2?'sr3':''),
              style:{fontSize:'1.25rem',width:'1.6rem'}},i+1),
            h(Ei,{e:p.flag,cls:'ei-md',alt:p.name}),
            h('div',{style:{flex:1,minWidth:0,overflow:'hidden'}},
              h('div',{style:{fontWeight:600,fontSize:'.82rem',overflow:'hidden',
                textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:1.2}},p.name),
              (p.participant||p.role)&&h('div',{className:'pcard-meta',
                style:{fontSize:'.68rem',marginTop:'.06rem'}},
                p.participant&&h('span',{className:'pmeta-name'},p.participant),
                p.participant&&p.role&&h('span',null,' \u00B7 '),
                p.role&&h('span',null,p.role)
              )
            ),
            h('div',{className:'spts',
              style:{fontSize:'1.45rem',color:i===0&&p.score>0?'var(--gold)':'var(--text)'}},p.score),
            h('div',{className:'sbar','aria-hidden':'true',style:{width:(p.score/max*100)+'%'}})
          ))
        )
      )
    )
  );
}



/* ── Mount ────────────────────────────────────────────── */
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
